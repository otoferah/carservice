name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-test
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-desktop.yml"
      - "public/ferah-logo.svg"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm install

      - name: Install icon tooling
        run: npm install --no-save --package-lock=false sharp

      - name: Generate Otoferah application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          node generate-icons.cjs
          python -m pip install --disable-pip-version-check Pillow
          python -c "from PIL import Image; Image.open('build/icon.png').convert('RGBA').save('build/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Ferah-Otomotiv-Windows-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
